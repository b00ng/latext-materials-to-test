name = "mcq-generator"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
ENVIRONMENT = "development"
NORMALIZER_URL = "https://normalizer-service.thanhhien-writer.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "mcq-generator-db"
database_id = "02f0bdac-8681-412b-851f-84740ce7ddc5"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "mcq-materials"

[[queues.producers]]
binding = "EXTRACTION_QUEUE"
queue = "extraction-jobs"

[[queues.consumers]]
queue = "extraction-jobs"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "extraction-dlq"

[[kv_namespaces]]
binding = "CACHE"
id = "174bb2e9a6a549bd8d599156ab613532"

[triggers]
crons = ["0 */6 * * *"]
